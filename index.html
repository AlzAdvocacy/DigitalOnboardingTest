:root{
  --page:#ffffff; --band:#f6f3f8; --card:#ffffff; --border:#d1d3d4; --text:#58595b; --muted:#6f7073;
  --heading:#4a0d66; --chip:#ede7f0; --chip-text:#4a0d66; --earned-bg:#fff6e6; --locked-bg:#f1f2f2;
  --locked-text:#58595b; --btn:#4a0d66; --btn-text:#ffffff; --link:#4a0d66; --note:#fff6e6;
  --medal-bg:#ffffff; --track:#ede7f0; --hero:#2a0739; --hero-seg:#77498c;
  --shadow:0 6px 18px rgba(40,10,55,.10); --shadow-lg:0 16px 40px rgba(40,10,55,.14);
  --gold:#ffa400; --gold-25:#ffe8bf; --gold-50:#ffd180; --teal:#34d9c3; --teal-25:#ccf6f0; --success:#1fa892;
  --pill-text:#4a0d66; --focus:0 0 0 3px rgba(31,168,146,.55);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#140e19; --band:#1c1423; --card:#231a2c; --border:#3b2f47; --text:#e4dcea; --muted:#b2a6be;
    --heading:#dcc6ef; --chip:#33264a; --chip-text:#ecdff8; --earned-bg:#2c2312; --locked-bg:#1c1722;
    --locked-text:#c9bfd3; --btn:#dcc6ef; --btn-text:#2a0739; --link:#dcc6ef; --note:#2c2312;
    --medal-bg:#ffffff; --track:#33264a; --hero:#1e0529; --hero-seg:#5c3a70;
    --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
    --success:#34d9c3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#140e19; --band:#1c1423; --card:#231a2c; --border:#3b2f47; --text:#e4dcea; --muted:#b2a6be;
  --heading:#dcc6ef; --chip:#33264a; --chip-text:#ecdff8; --earned-bg:#2c2312; --locked-bg:#1c1722;
  --locked-text:#c9bfd3; --btn:#dcc6ef; --btn-text:#2a0739; --link:#dcc6ef; --note:#2c2312;
  --medal-bg:#ffffff; --track:#33264a; --hero:#1e0529; --hero-seg:#5c3a70;
  --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
  --success:#34d9c3; color-scheme:dark;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:"Houschka Alt Pro",Arial,system-ui,sans-serif;font-feature-settings:"calt" 0;font-size:16px;line-height:1.5}
[hidden]{display:none !important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus)}
img{max-width:100%}

.band{padding-left:max(64px,calc((100% - 1312px) / 2));padding-right:max(64px,calc((100% - 1312px) / 2))}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--heading)}
.caps{text-transform:uppercase}

/* Demo and reviewer bars */
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-top:12px;padding-bottom:12px;background:var(--band);border-bottom:1px solid var(--border);font-size:15px}
.demo-bar strong{color:var(--heading)}
.reviewer-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-top:14px;padding-bottom:14px;background:#ffa400;color:#2a0739;font-size:16px;font-weight:700}
.reviewer-bar .link-btn{color:#2a0739}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff}
.hero-pattern{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;pointer-events:none}
.hero-inner{position:relative;padding-top:24px;padding-bottom:40px;display:flex;flex-direction:column;gap:20px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo-white{position:relative;width:112px;height:63px;overflow:hidden;flex-shrink:0}
.logo-white img{position:absolute;left:-24px;top:-47px;width:157px;height:157px;max-width:none}
.hero-top p{margin:0;font-size:15px;font-weight:700}
.hero-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center}
.hero-left{grid-column:span 7;display:flex;flex-direction:column;gap:10px}
.hero-left .eyebrow{color:#34d9c3}
.hero-title{margin:0;font-size:60px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;color:#fff}
.hero-sub{margin:0;font-size:22px;line-height:1.2;font-weight:700;color:#fff}
.hero-lede{margin:0;font-size:17px;line-height:1.55;color:rgba(255,255,255,.78);max-width:600px}
.xp{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-width:620px}
.xp-segs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.xp-seg{height:10px;border-radius:999px;background:var(--hero-seg);transition:background-color .36s cubic-bezier(.16,1,.3,1)}
.xp-seg.done{background:#34d9c3}
.xp-seg.next{background:#ffa400}
.xp-labels{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.hero-card{grid-column:9 / span 4;display:flex;justify-content:center}

/* Credential card: tap it five times to unlock reviewer access */
.cred{position:relative;width:272px;max-width:100%;background:#ffffff;color:#58595b;border-radius:20px;box-shadow:0 16px 40px rgba(40,10,55,.25);padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotate(3deg);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.cred.tapped{transform:rotate(3deg) scale(.985)}
.cred-slot{position:absolute;top:10px;left:50%;width:52px;height:8px;margin-left:-26px;border-radius:999px;background:#d1d3d4}
.cred-logo{width:96px;height:auto;margin-top:6px}
.cred-rule{width:100%;height:1px;background:#d1d3d4}
.cred .eyebrow{color:#4a0d66}
.cred-name{margin:0;font-size:24px;line-height:1.05;font-weight:800;text-transform:uppercase;color:#4a0d66;text-align:center}
.cred-level{margin:0;font-size:14px;text-align:center}
.cred-medals{display:flex;gap:8px;margin-top:4px}
.cred-count{margin:0;font-size:13px;font-weight:700}

/* Medals */
.medal{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#ffffff;border:2px solid #d1d3d4;transition:transform .36s cubic-bezier(.16,1,.3,1)}
.medal img{height:auto}
.medal.locked{background:#f1f2f2}
.medal.locked img{opacity:.35}
.medal.current{border:3px dashed #4a0d66}
.medal.earned{background:#ffe8bf;border:3px solid #ffa400}
.medal.sm{width:46px;height:46px}
.medal.sm img{width:24px}
.medal.lg{width:96px;height:96px;border-width:4px}
.medal.lg.locked{border-width:2px}
.medal.lg img{width:52px}
.medal.xl{width:140px;height:140px;border-width:5px}
.medal.xl img{width:78px}

/* Badges */
.badges{padding-top:72px;padding-bottom:64px;display:flex;flex-direction:column;gap:32px}
.section-title{margin:0;font-size:44px;line-height:1.05;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;color:var(--heading)}
.badge-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.badge-card{position:relative;border-radius:16px;background:var(--card);border:1px solid var(--border);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:box-shadow .22s,transform .22s}
.badge-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.badge-card.earned{background:var(--earned-bg);border:2px solid #ffa400}
.badge-card.current{border:2px solid var(--heading);box-shadow:var(--shadow)}
.badge-card.locked{background:var(--locked-bg)}
.badge-card[aria-pressed="true"]::after{content:"Viewing";position:absolute;top:12px;right:12px;padding:2px 10px;border-radius:999px;background:var(--heading);color:var(--page);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge-name{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--heading)}
.badge-card.locked .badge-name{color:var(--locked-text)}
.badge-level{margin:0;font-size:15px}
.mini{width:100%;display:flex;flex-direction:column;gap:6px}
.mini-track{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.mini-fill{height:100%;background:var(--heading);border-radius:999px;transition:width .36s cubic-bezier(.16,1,.3,1)}
.mini-label{font-size:13px;font-weight:700;color:var(--heading)}
.badge-card.locked .mini-label{color:var(--locked-text)}

/* Pills and buttons */
.pill{display:inline-flex;align-items:center;align-self:flex-start;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pill-text);background:var(--gold-25);white-space:nowrap}
.pill.gold{background:#ffa400;color:#2a0739}
.pill.teal{background:var(--teal-25);color:#2a0739}
.pill.approve{background:var(--gold-25);color:#2a0739}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:700;cursor:pointer;transition:filter .14s,transform .14s}
.btn:hover{filter:brightness(.92)}
.btn:active{transform:translateY(1px)}
.btn.outline{background:transparent;color:var(--btn);border:2px solid var(--btn)}
.btn.small{min-height:40px;padding:0 18px;font-size:14px}
.link-btn{background:none;border:0;padding:4px 0;font-size:15px;font-weight:700;color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Tasks */
.quests{padding-top:64px;padding-bottom:64px;background:var(--band);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:32px;align-items:start}
.quests-main{grid-column:span 7;display:flex;flex-direction:column;gap:18px}
.quests-side{grid-column:span 5;display:flex;flex-direction:column;gap:18px;padding-top:34px}
.level-title{margin:0;font-size:36px;line-height:1.05;font-weight:800;text-transform:uppercase;color:var(--heading)}
.level-note{margin:-6px 0 6px;font-size:17px}
.task{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:22px 24px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .22s,border-color .22s}
.task.next{border:2px solid var(--heading);box-shadow:var(--shadow);padding:28px}
.task.flash{box-shadow:0 0 0 4px #ffa400}
.task-head{display:flex;gap:14px;align-items:flex-start}
.task-icon{width:44px;height:44px;border-radius:50%;background:#ffffff;border:1px solid #d1d3d4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task-icon img{width:26px;height:auto}
.task-body{display:flex;flex-direction:column;gap:8px;flex-grow:1;min-width:0}
.task-pills{display:flex;flex-wrap:wrap;gap:8px}
.task-title{margin:0;font-size:19px;line-height:1.3;font-weight:700;color:var(--heading)}
.task.next .task-title{font-size:26px;line-height:1.25}
.task-details{margin:0;font-size:16px;line-height:1.6}
.task-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:4px}
.task.done{padding:16px 20px}
.done-row{display:flex;gap:14px;align-items:center}
.check{width:32px;height:32px;border-radius:50%;background:var(--success);border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
button.check{cursor:pointer}
.done-title{margin:0;flex-grow:1;font-size:17px;line-height:1.35}
.done-meta{font-size:14px;color:var(--muted);flex-shrink:0}
.waiting-text{margin:0;font-size:15px;color:var(--muted)}
.answers{border-radius:12px;background:var(--band);padding:0}
.quests .answers{background:var(--page)}
.answers summary{cursor:pointer;padding:10px 14px;font-size:15px;font-weight:700;color:var(--link)}
.answers dl{margin:0;padding:0 14px 14px}
.answers dt{font-size:13px;font-weight:700;margin-top:10px}
.answers dd{margin:2px 0 0;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.note{border-radius:12px;background:var(--note);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.note-edit{display:flex;flex-direction:column;gap:10px}
textarea,.field input[type=text],.pin-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:16px;line-height:1.45;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.side-card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:12px}
.side-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:16px;line-height:1.35}
.side-card.dark{background:#4a0d66;border-color:#4a0d66;color:#fff}
.side-card.dark .eyebrow{color:#ffa400}
.side-card.dark .link-btn{color:#fff}
.side-card.gold{border:2px solid #ffa400}

.email{padding-top:40px;padding-bottom:8px}
.email-card{border:2px dashed var(--border);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.email-card pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6}
.foot{margin:0;padding-top:32px;padding-bottom:48px;font-size:15px;color:var(--muted)}

/* Dialogs */
dialog{border:0;border-radius:24px;padding:32px;width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);background:var(--card);color:var(--text);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(20,6,28,.6)}
.dialog-title{margin:0;font-size:28px;line-height:1.1;font-weight:800;text-transform:uppercase;color:var(--heading)}
.dialog-sub{margin:8px 0 20px;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field + .field{margin-top:16px}
.field label{font-size:15px;font-weight:700}
.confirm-row{display:flex;gap:12px;align-items:flex-start;font-weight:700;cursor:pointer}
.confirm-row input{width:22px;height:22px;margin:1px 0 0;accent-color:#4a0d66;flex-shrink:0}
.field-error{margin:0;font-size:14px;font-weight:700;color:#c77f00}
[aria-invalid="true"]{border-color:#c77f00 !important;border-width:2px !important}
.dialog-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:24px}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.celebrate .medal{animation:pop .6s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:14px 22px;border-radius:999px;background:#2a0739;color:#fff;font-size:15px;font-weight:700;box-shadow:0 16px 40px rgba(0,0,0,.3);z-index:20;text-align:center}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:10px;height:10px;border-radius:2px;animation:fall var(--d) cubic-bezier(.4,0,.2,1) var(--delay) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r));opacity:.3}}

@media (max-width:1080px){
  .hero-grid{grid-template-columns:1fr;row-gap:28px}
  .hero-left,.hero-card{grid-column:1 / -1}
  .badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quests{grid-template-columns:1fr;row-gap:32px}
  .quests-main,.quests-side{grid-column:1 / -1}
  .quests-side{padding-top:0}
}
@media (max-width:640px){
  .band{padding-left:20px;padding-right:20px}
  .hero-top{flex-direction:column;align-items:flex-start}
  .hero-title{font-size:40px}
  .hero-sub{font-size:19px}
  .section-title{font-size:32px}
  .level-title{font-size:28px}
  .badge-grid{grid-template-columns:1fr}
  .task.next .task-title{font-size:21px}
  .task.next{padding:22px}
  dialog{padding:24px}
  .done-row{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

/* Live page additions */
.loading{margin:0;padding-top:48px;padding-bottom:48px;font-size:18px;color:var(--muted)}
.message{background:var(--hero);color:#fff;min-height:100vh}
.message-inner{padding-top:40px;padding-bottom:64px;display:flex;flex-direction:column;gap:20px;max-width:900px}
.message-title{margin:24px 0 0;font-size:44px;line-height:1.05;font-weight:800;text-transform:uppercase;color:#fff}
.message-body{margin:0;font-size:19px;line-height:1.6;color:rgba(255,255,255,.82)}
.toast.error{background:#ffa400;color:#2a0739}
.side-date{color:var(--muted);font-size:14px}
.side-note{margin:0;font-size:20px;line-height:1.4}
a.btn{text-decoration:none}
</style>

  /* Review questions: separated by | or new lines. "(optional)" at the end makes one optional;
     "Confirm:" at the start makes a required checkbox; questions starting with "Paste" get a bigger box. */
  function parseQuestions(raw) {
    return String(raw || '').split(/\r?\n|\|/).map((s) => s.trim()).filter(Boolean).map((line) => {
      const m = line.match(/^confirm:\s*(.+)$/i);
      if (m) return { type: 'confirm', q: m[1].trim(), required: true };
      return { type: 'text', q: line, required: !/\(optional\)\s*$/i.test(line), long: /^paste\b/i.test(line) };
    });
  }

    if (!raw) return [];
    try { const v = JSON.parse(raw); return Array.isArray(v) ? v.filter((x) => x && typeof x.q === 'string') : []; } catch (e) { return []; }
  }
  function summaryText(answers) {
    return answers.map((a) => (a.type === 'confirm' ? 'Confirmed: ' + a.q : a.q + '\n' + (a.a || 'No answer'))).join('\n\n');
  }

  /* ---------- Talking to the Power Automate flow ---------- */
  async function callFlow(payload) {
    // text/plain keeps the browser from sending a preflight request the flow can't answer.
    const res = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('http_' + res.status);
    return res.json();
  }

  function toChecklist(rows) {
    const items = rows.map((r) => ({
      no: Number(r.ID),
      order: Number(r.ItemNo) || 0,
      section: r.Section || '',
      title: r.Title || '',
      details: r.Details || '',
      link: /^https?:\/\//i.test(r.TaskLink || '') ? r.TaskLink : '',
      approval: r.NeedsApproval === true,
      questions: parseQuestions(r.ReviewQuestions),
      submission: parseSubmission(r.Submission),
      sent: r.SentForReview === true,
      sentAt: r.SentAt || '',
      done: r.Done === true,
      doneBy: r.CheckedBy || '',
      doneAt: r.CheckedAt || '',
      note: r.Note || '',
      noteBy: r.NoteBy || '',
      noteAt: r.NoteAt || '',
    })).sort((a, b) => a.order - b.order || a.no - b.no);
    const levels = [];
    items.forEach((it) => {
      if (!levels.length || levels[levels.length - 1].name !== it.section) {
        const l = levels.length;
        levels.push({ name: it.section || 'Level ' + (l + 1), badge: BADGES[l] || 'Level ' + (l + 1), icon: ICONS[l % ICONS.length], items: [] });
      }
      it.level = levels.length - 1;
      levels[levels.length - 1].items.push(it);
    });
    return { name: (rows[0] && rows[0].StaffName) || '', items: items, levels: levels };
  }

  async function apiLoad(pin) {
    const payload = { action: 'load', id: id };
    if (pin) { payload.who = OWNER_NAME; payload.pin = pin; }
    const r = await callFlow(payload);
    if (r && r.ok && Array.isArray(r.rows)) {
      if (!r.rows.length) return { ok: false, error: 'not_found' };
      return { ok: true, checklist: toChecklist(r.rows), reviewer: r.owner === true };
    }
    return r || { ok: false, error: 'server_error' };
  }

  function save(change, okText, rollback) {
    const payload = Object.assign({ action: 'save', id: id, who: who() }, reviewerPin ? { pin: reviewerPin } : {}, change);
    pending++;
    queue = queue.then(async () => {
      try {
        const r = await callFlow(payload);
        if (!r || !r.ok) throw new Error((r && r.error) || 'save_failed');
        if (pending === 1 && okText) toast(okText);
      } catch (err) {
        rollback();
        afterLocalChange();
        toast('That change didn\u2019t save. Check your connection and try again.', true);
      } finally {
        pending--;
      }
    });
  }

  async function refresh(firstLoad) {
    if (!firstLoad && pending > 0) return;
    try {
      const r = await apiLoad(reviewerPin);
      if (!r.ok) {
        if (firstLoad && r.error === 'not_found') showMessage('This link doesn\u2019t match a checklist', 'Check that you copied the whole link. If it still doesn\u2019t work, ask the person who sent it for a new one.');
        else if (firstLoad) showMessage('The checklist didn\u2019t load', 'Reload the page in a minute. If it keeps happening, let the person who sent you this link know.');
        return;
      }
      if (!firstLoad && pending > 0) return; // a save started meanwhile; the next check catches up

      }

  /* ---------- Derived state ---------- */

  // Re-draws the page and celebrates any badge that was just earned, whether by this person or by an update from the other one.

    const nt = nextTask();
    const isNext = !!nt && nt.no === t.no;
    const owner = first(OWNER_NAME);
    const card = el('article', 'task' + (t.done ? ' done' : '') + (isNext ? ' next' : ''));
    card.id = 'task-' + t.no;

    if (t.done) {
      const row = el('div', 'done-row');
      const canUndo = !t.approval || isReviewer();
      const check = canUndo ? button('check', null, () => setDone(t.no, false), { 'aria-label': 'Mark not done: ' + t.title }) : el('span', 'check');
      check.append(checkSvg(18));
      row.append(check, el('p', 'done-title', t.title));
      const by = t.doneBy ? (t.approval ? 'Approved by ' : 'Done by ') + first(t.doneBy) + (t.doneAt ? ' on ' + fmt(t.doneAt) : '') : (t.approval ? 'Approved' : 'Done');
      row.append(el('span', 'done-meta', by));
      card.append(row);
      if (t.approval && isReviewer()) card.append(button('link-btn', 'Undo approval', () => setDone(t.no, false)));
    } else {
      const head = el('div', 'task-head');
      const icon = el('span', 'task-icon'); const img = el('img'); img.src = data.levels[t.level].icon; img.alt = ''; icon.append(img);
      const body = el('div', 'task-body');
      const pills = el('div', 'task-pills');
      if (isNext) pills.append(el('span', 'pill gold', 'Up next'));
      if (t.approval && !t.sent) pills.append(el('span', 'pill approve', owner + ' approves'));
      if (t.sent) pills.append(el('span', 'pill teal', 'With ' + owner + (t.sentAt ? ' since ' + fmt(t.sentAt) : '')));
      if (pills.childNodes.length) body.append(pills);
      body.append(el('p', 'task-title', t.title));
      if (t.details) body.append(el('p', 'task-details', t.details));
      head.append(icon, body);
      card.append(head);

      const actions = el('div', 'task-actions');
      if (t.link) {
        const a = el('a', isNext && !t.approval ? 'btn' : 'btn outline small', 'Open Link');
        a.href = t.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', 'Open link for ' + t.title + ' (opens in a new tab)');
        actions.append(a);
      }
      if (isReviewer()) {
        if (t.approval && t.sent) actions.append(button('btn', 'Approve', () => setDone(t.no, true)), button('link-btn', 'Send back', () => sendBack(t.no)));
        else if (t.approval) actions.append(el('span', 'waiting-text', 'Not sent for review yet'), button('link-btn', 'Approve anyway', () => setDone(t.no, true)));
        else actions.append(button('btn outline small', 'Mark Done', () => setDone(t.no, true)));
      } else if (t.approval) {
        if (t.sent) actions.append(el('span', 'waiting-text', owner + ' has your answers.'), button('link-btn', 'Take back', () => setReview(t.no, false)));
        else actions.append(button(isNext ? 'btn' : 'btn small', 'Send to ' + owner + ' for Review', () => startReview(t.no)));
      } else {
        actions.append(button(isNext && !t.link ? 'btn' : 'btn outline' + (isNext ? '' : ' small'), 'Mark Done', () => setDone(t.no, true)));
      }
      card.append(actions);
    }

    if (t.approval && t.submission.length) {
      const d = el('details', 'answers');
      d.open = isReviewer() && t.sent && !t.done;
      d.append(el('summary', null, isReviewer() ? 'Their answers' : 'Your answers'));
      const dl = el('dl');
      t.submission.forEach((a) => {
        const confirm = a.type === 'confirm' || a.confirm;
        dl.append(el('dt', null, confirm ? 'Confirmed' : a.q), el('dd', null, confirm ? a.q : (a.a ? String(a.a) : 'No answer')));
      });
      d.append(dl);
      card.append(d);
    }
    card.append(noteArea(t));
    return card;
  }

  function noteArea(t) {
    const wrap = el('div');
    if (ui.editing === t.no) {
      const box = el('div', 'note-edit');
      const ta = el('textarea'); ta.rows = 3; ta.value = ui.draft; ta.maxLength = 2000;
      ta.setAttribute('aria-label', 'Note for ' + t.title); ta.setAttribute('data-note-editor', String(t.no));
      ta.addEventListener('input', () => { ui.draft = ta.value; });
      ta.addEventListener('keydown', (e) => { if (e.key === 'Escape') { ui.editing = null; render(); } });
      const row = el('div', 'row');
      row.append(button('btn small', 'Save Note', () => saveNote(t.no)), button('link-btn', 'Cancel', () => { ui.editing = null; render(); }));
      box.append(ta, row); wrap.append(box);
    } else if (t.note) {
      const n = el('div', 'note');
      n.append(el('p', null, t.note));
      const foot = el('div', 'note-foot');
      foot.append(el('span', null, (t.noteBy ? first(t.noteBy) : 'Note') + (t.noteAt ? ' on ' + fmt(t.noteAt) : '')), button('link-btn', 'Edit note', () => { ui.editing = t.no; ui.draft = t.note; render(); }));
      n.append(foot); wrap.append(n);
    } else {
      wrap.append(button('link-btn', 'Add note', () => { ui.editing = t.no; ui.draft = ''; render(); }));
    }
    return wrap;
  }

  function renderSide() {
    const side = $('side'); side.replaceChildren();
    const owner = first(OWNER_NAME);
    const waiting = data.items.filter((t) => t.sent && !t.done);
    if (waiting.length) {
      const c = el('div', 'side-card gold');
      c.append(el('p', 'eyebrow', isReviewer() ? 'Waiting on your review' : 'With ' + owner + ' for review'));
      waiting.forEach((t) => {
        const item = el('div', 'side-item');
        const txt = el('span'); txt.append(el('span', null, t.title));
        if (t.sentAt) { txt.append(el('br')); const d = el('span', 'side-date', 'Sent ' + fmt(t.sentAt)); txt.append(d); }
        item.append(txt, button('link-btn', isReviewer() ? 'Review' : 'View', () => jumpTo(t.no)));
        c.append(item);
      });
      side.append(c);
    }
    const cur = currentLevel();
    const up = Math.min(Math.max(viewingLevel(), cur) + 1, data.levels.length);
    if (up < data.levels.length) {
      const c = el('div', 'side-card');
      c.append(el('p', 'eyebrow', 'Coming up in level ' + (up + 1)));
      data.levels[up].items.forEach((t) => {
        const item = el('div', 'side-item');
        item.append(el('span', null, t.title));
        if (t.done) item.append(el('span', 'pill teal', 'Done'));
        else if (t.sent) item.append(el('span', 'pill teal', 'With ' + owner));
        else if (t.approval) item.append(el('span', 'pill approve', owner + ' approves'));
        c.append(item);
      });
      side.append(c);
    }
    const oneOnOne = data.items.find((t) => /1:1/.test(t.title));
    if (oneOnOne) {
      const one = el('div', 'side-card dark');
      one.append(el('p', 'eyebrow', 'Your 1:1 with ' + owner));
      const p = el('p', 'side-note', oneOnOne.note || (oneOnOne.done ? 'Booked. Add a note on the 1:1 task with the date and time.' : 'Not booked yet. Once it is, add a note on the 1:1 task and it shows up here.'));
      one.append(p);
      side.append(one);
    }
  }

  function jumpTo(no) {
    const t = getItem(no); if (!t) return;
    ui.viewLevel = t.level; render();
    const card = $('task-' + no);
    if (card) { card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1400); }
  }

  /* ---------- Actions: each updates the page right away, then saves through the flow ---------- */
  function setDone(no, value) {
    const t = getItem(no); if (!t) return;
    if (t.approval && !isReviewer()) return;
    const prev = { done: t.done, doneBy: t.doneBy, doneAt: t.doneAt };
    Object.assign(t, { done: value, doneBy: value ? who() : '', doneAt: value ? new Date().toISOString() : '' });
    afterLocalChange();
    const okText = t.approval ? (value ? 'Approved.' : 'Approval undone.') : (value ? 'Saved for both of you.' : 'Marked not done.');
    save({ no: no, field: 'done', value: value }, okText, () => { const c = getItem(no); if (c) Object.assign(c, prev); });
  }

  function setReview(no, value, answers, okText) {
    const t = getItem(no); if (!t || t.done) return;
    const prev = { sent: t.sent, sentAt: t.sentAt, submission: t.submission };
    Object.assign(t, { sent: value, sentAt: value ? new Date().toISOString() : '' });
    if (value) t.submission = answers || [];
    afterLocalChange();
    const owner = first(OWNER_NAME);
    const sentText = NOTIFICATIONS_ON
      ? 'Sent to ' + owner + '. ' + (answers && answers.length ? 'He gets your answers by email.' : 'He gets a notification.')
      : 'Sent to ' + owner + ' for review. Be sure to ping him too.';
    const change = { no: no, field: 'review', value: value };
    if (value) { change.submission = answers || []; change.summary = summaryText(answers || []); }
    save(change, okText || (value ? sentText : 'Taken back. Send it again when it\u2019s ready.'), () => { const c = getItem(no); if (c) Object.assign(c, prev); });
  }

  function sendBack(no) {
    ui.editing = no; ui.draft = '';
    setReview(no, false, null, 'Sent back. Leave a note about what to change.');
  }

  function saveNote(no) {
    const t = getItem(no); if (!t) return;
    const text = ui.draft.trim();
    const prev = { note: t.note, noteBy: t.noteBy, noteAt: t.noteAt };
    ui.editing = null; ui.draft = '';
    if (text === t.note) { render(); return; }
    Object.assign(t, { note: text, noteBy: text ? who() : '', noteAt: text ? new Date().toISOString() : '' });
    afterLocalChange();
    save({ no: no, field: 'note', value: text }, text ? 'Note saved.' : 'Note removed.', () => {
      const c = getItem(no); if (c) Object.assign(c, prev);
      ui.editing = no; ui.draft = text; // reopen with the unsaved text so nothing is lost
    });
  }

  /* ---------- Review pop-up ---------- */
  function startReview(no) {
    const t = getItem(no); if (!t) return;
    if (!t.questions.length) { setReview(no, true, []); return; }
    ui.reviewNo = no;
    $('review-title').textContent = 'Send to ' + first(OWNER_NAME) + ' for review';
    $('review-task').textContent = t.title;
    const wrap = $('review-fields'); wrap.replaceChildren();
    t.questions.forEach((q, i) => {
      const f = el('div', 'field'); const fid = 'rq-' + i;
      if (q.type === 'confirm') {
        const lab = el('label', 'confirm-row'); const cb = el('input'); cb.type = 'checkbox'; cb.id = fid;
        lab.append(cb, el('span', null, q.q)); f.append(lab);
      } else {
        const lab = el('label', null, q.q); lab.htmlFor = fid;
        const input = q.long ? el('textarea') : el('input');
        if (q.long) input.rows = 4; else input.type = 'text';
        input.id = fid; input.maxLength = 2000;
        const old = t.submission.find((p) => p.type !== 'confirm' && !p.confirm && p.q === q.q);
        if (old && old.a) input.value = String(old.a);
        f.append(lab, input);
      }
      const err = el('p', 'field-error'); err.id = fid + '-err'; err.hidden = true; f.append(err);
      wrap.append(f);
    });
    $('review-dialog').showModal();
    const firstInput = wrap.querySelector('input, textarea'); if (firstInput) firstInput.focus();
  }
  $('review-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = getItem(ui.reviewNo);
    if (!t) { $('review-dialog').close(); return; }
    let firstBad = null;
    const answers = t.questions.map((q, i) => {
      const input = $('rq-' + i); const err = $('rq-' + i + '-err');
      const bad = q.type === 'confirm' ? !input.checked : (q.required && !input.value.trim());
      err.textContent = bad ? (q.type === 'confirm' ? 'Check this box before sending.' : 'Answer this before sending.') : '';
      err.hidden = !bad; input.setAttribute('aria-invalid', String(bad));
      if (bad) input.setAttribute('aria-describedby', err.id); else input.removeAttribute('aria-describedby');
      if (bad && !firstBad) firstBad = input;
      return q.type === 'confirm' ? { type: 'confirm', q: q.q, a: true } : { type: 'text', q: q.q, a: input.value.trim() };
    });
    if (firstBad) { firstBad.focus(); return; }
    $('review-dialog').close();
    setReview(t.no, true, answers);
  });
  const clearErr = (e) => { const err = $(e.target.id + '-err'); if (err) { err.hidden = true; e.target.setAttribute('aria-invalid', 'false'); } };
  $('review-fields').addEventListener('input', clearErr);
  $('review-fields').addEventListener('change', clearErr);
  $('review-cancel').addEventListener('click', () => $('review-dialog').close());

  /* ---------- Reviewer access: tap the credential card five times, then enter the PIN ---------- */
  $('cred').addEventListener('click', () => {
    const c = $('cred'); c.classList.add('tapped'); setTimeout(() => c.classList.remove('tapped'), 120);
    const now = Date.now();
    ui.taps = ui.taps.filter((x) => now - x < 3000); ui.taps.push(now);
    if (ui.taps.length < 5 || isReviewer()) return;
    ui.taps = [];
    $('pin-input').value = ''; $('pin-error').hidden = true; $('pin-input').removeAttribute('aria-invalid');
    $('pin-dialog').showModal(); $('pin-input').focus();
  });
  $('pin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = $('pin-input').value.trim();
    const fail = (msg) => { $('pin-error').textContent = msg; $('pin-error').hidden = false; $('pin-input').setAttribute('aria-invalid', 'true'); $('pin-input').focus(); };
    if (!pin) { fail('Enter your PIN.'); return; }
    const go = $('pin-go'); go.disabled = true; go.textContent = 'Checking\u2026';
    try {
      const r = await apiLoad(pin);
      if (r.ok && r.reviewer) {
        reviewerPin = pin; storePin(pin);
        $('pin-dialog').close();
        ui.editing = null;
        apply(r.checklist, false);
        toast('Unlocked. You\u2019re reviewing as ' + first(OWNER_NAME) + '.');
      } else fail('That PIN didn\u2019t work.');
    } catch (x) {
      fail('Couldn\u2019t check your PIN. Check your connection and try again.');
    } finally {
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
  $('pin-cancel').addEventListener('click', () => $('pin-dialog').close());
  $('lock').addEventListener('click', () => { reviewerPin = null; clearPin(); ui.editing = null; render(); toast('Locked. Back to the staff view.'); });

  /* ---------- Celebrations ---------- */
  function celebrate(level) {
    const holder = $('celebrate-medal'); holder.replaceChildren();
    const n = data.levels.length;
    if (level === null) {
      holder.append(medal(n - 1, 'earned', 'xl'));
      $('celebrate-eyebrow').textContent = 'All ' + n + ' badges earned';
      $('celebrate-title').textContent = 'You\u2019re fully onboarded';
      $('celebrate-text').textContent = 'You\u2019ve completed Digital Advocacy onboarding. You\u2019re ready to run digital strategy in your region using our tools and best practices.';
      $('celebrate-close').textContent = 'Done';
    } else {
      holder.append(medal(level, 'earned', 'xl'));
      $('celebrate-eyebrow').textContent = 'Badge earned';
      $('celebrate-title').textContent = data.levels[level].badge;
      const next = currentLevel();
      $('celebrate-text').textContent = 'You finished ' + data.levels[level].name + '.' + (next < n ? ' Next up: level ' + (next + 1) + ', ' + data.levels[next].name + '.' : '');
      $('celebrate-close').textContent = 'Keep Going';
    }
    setTimeout(() => {
      const d = $('celebrate-dialog');
      if (d.open) d.close();
      d.showModal(); confetti(level === null ? 90 : 50);
    }, 250);
  }
  $('celebrate-close').addEventListener('click', () => { $('celebrate-dialog').close(); ui.viewLevel = null; render(); });
  function confetti(count) {
    if (reduceMotion) return;
    const box = el('div', 'confetti'); box.setAttribute('aria-hidden', 'true');
    const colors = ['#4a0d66', '#34d9c3', '#ffa400', '#a486b2', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const c = el('i');
      c.style.left = (Math.random() * 100).toFixed(1) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--d', (2.2 + Math.random() * 1.8).toFixed(2) + 's');
      c.style.setProperty('--delay', (Math.random() * 0.6).toFixed(2) + 's');
      c.style.setProperty('--x', Math.round(Math.random() * 160 - 80) + 'px');
      c.style.setProperty('--r', Math.round(Math.random() * 720 - 360) + 'deg');
      if (i % 3 === 0) c.style.borderRadius = '50%';
      box.append(c);
    }
    (document.querySelector('dialog[open]') || document.body).append(box); // inside the pop-up so it falls in front of the dimmed background
    setTimeout(() => box.remove(), 4500);
  }

  /* ---------- Start ---------- */
  if (!id) {
    showMessage('Open your personal link', 'This page shows one person\u2019s onboarding checklist. Use the link you were sent. It ends with ?id= and a short code.');
  } else if (FLOW_URL.indexOf('PASTE_') === 0) {
    showMessage('One more setup step', 'Add your Power Automate flow URL to FLOW_URL in index.html, then reload this page.');
  } else {
    reviewerPin = readPin();
    refresh(true);
    setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); });
  }
})();
</script>
</body>
</html>
