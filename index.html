<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Checklist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%238A4FB5'%3E%3Ccircle cx='12' cy='6' r='4.2'/%3E%3Ccircle cx='17.7' cy='10.2' r='4.2'/%3E%3Ccircle cx='15.5' cy='17' r='4.2'/%3E%3Ccircle cx='8.5' cy='17' r='4.2'/%3E%3Ccircle cx='6.3' cy='10.2' r='4.2'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='3' fill='%23F2C94C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF9FD;
    --ink: #231632;
    --muted: #6B5D79;
    --line: #E7E0EF;
    --box: #B9A8CB;
    --purple: #4A0D66;
    --on-purple: #FFFFFF;
    --bloom: #8A4FB5;
    --bud: #DCD0E8;
    --stem: #7FA27B;
    --center: #F2C94C;
    --note: #FFF7DC;
    --note-edge: #EAD58F;
    --banner: #F1E8F8;
    --error: #A3261F;
    --focus: #8A4FB5;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17111D;
      --ink: #F2ECF7;
      --muted: #B5A8C2;
      --line: #342A3F;
      --box: #6E5E80;
      --purple: #D4B5EE;
      --on-purple: #231632;
      --bloom: #B98AE0;
      --bud: #56466E;
      --stem: #86AE82;
      --center: #F2C94C;
      --note: #2A2417;
      --note-edge: #6A5822;
      --banner: #271D31;
      --error: #FF9A90;
      --focus: #C9A2EA;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  @media (min-width: 40rem) { .wrap { padding: 4rem 2.5rem 5rem; } }

  /* Reviewer bar (only after unlocking) */
  .owner-bar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem 1rem;
    margin: -1rem 0 2rem; padding: .6rem 1rem;
    background: var(--banner); border-left: 4px solid var(--bloom);
    font-size: .95rem;
  }

  /* Header, set like the first page of a bill */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 600;
    color: var(--purple);
    font-size: clamp(2.3rem, 8vw, 3.5rem);
    line-height: 1.02;
    letter-spacing: -0.015em;
  }
  .subtitle { margin: .55rem 0 0; color: var(--muted); font-size: 1.125rem; }
  .status-line { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 1rem 0 0; font-size: .95rem; }
  .status-label { color: var(--muted); }
  .status-stage {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .15rem .75rem; border: 1px solid var(--line); border-radius: 999px;
    font-weight: 700;
  }
  .status-stage::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--bloom); }

  .stamp {
    flex: none; margin-top: .25rem;
    display: grid; justify-items: center; gap: .1rem;
    padding: .55rem 1rem .5rem;
    border: 3px double var(--purple); border-radius: .5rem;
    color: var(--purple);
    font-family: var(--serif);
    transform: rotate(-8deg);
  }
  .stamp-word { font-size: 1.35rem; font-weight: 600; letter-spacing: .08em; line-height: 1; }
  .stamp-date { font-size: .8rem; font-style: italic; }
  .stamp.stamp-in { animation: stamp .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-18deg) scale(1.6); } to { opacity: 1; transform: rotate(-8deg) scale(1); } }

  /* Progress garden: one flower per task, planted by section */
  .progress { margin-top: 2.5rem; }
  .garden {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 1.4rem;
    cursor: default; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .plot { display: grid; gap: .3rem; }
  .plot-flowers { display: flex; align-items: flex-end; gap: .15rem .3rem; min-height: 3rem; padding: 0 .15rem; }
  .plot-label {
    border-top: 1px solid var(--box); padding-top: .25rem;
    font-family: var(--serif); font-style: italic; font-size: .85rem; color: var(--muted); text-align: center;
  }
  .flower { display: block; width: 2rem; height: 3rem; transform-origin: 50% 100%; }
  .flower svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .stem { fill: none; stroke: var(--stem); stroke-width: 1.6; stroke-linecap: round; opacity: .45; transition: opacity .3s; }
  .leaf { fill: var(--stem); opacity: .45; transition: opacity .3s; }
  .petals {
    fill: var(--bud);
    transform-box: view-box; transform-origin: 12px 12px; transform: scale(.4);
    transition: transform .5s cubic-bezier(.34, 1.56, .64, 1), fill .3s;
  }
  .center { fill: var(--bud); transition: fill .3s; }
  .flower.bloom .petals { fill: var(--bloom); transform: scale(1); }
  .flower.bloom .center { fill: var(--center); }
  .flower.bloom .stem, .flower.bloom .leaf { opacity: 1; }
  .garden.intro .petals { transition-delay: calc(var(--i) * 55ms); }
  .garden.celebrate .flower { animation: sway 1s ease-in-out calc(var(--i) * 40ms) 2; }
  @keyframes sway { 0%, 100% { transform: none; } 35% { transform: translateY(-5px) rotate(-5deg); } 70% { transform: rotate(4deg); } }
  .count { margin: .9rem 0 0; font-weight: 700; }
  .done-banner { margin: 1.25rem 0 0; padding: .9rem 1.1rem; background: var(--banner); border-left: 4px solid var(--bloom); font-weight: 700; }

  /* Sections and tasks, numbered like a bill */
  .list { margin-top: 2.75rem; }
  .group + .group { margin-top: 2.5rem; }
  .group-kicker { margin: 0; font-family: var(--serif); font-style: italic; color: var(--muted); font-size: .95rem; }
  .group-title { margin: .1rem 0 .6rem; font-family: var(--serif); font-weight: 600; color: var(--purple); font-size: 1.45rem; line-height: 1.2; }
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .item { display: grid; grid-template-columns: 1.6rem 1fr; gap: .9rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .check {
    appearance: none; -webkit-appearance: none;
    width: 1.6rem; height: 1.6rem; margin: 0;
    border: 2px solid var(--box); border-radius: .45rem;
    background: transparent; cursor: pointer;
    display: grid; place-content: center;
    transition: background-color .15s, border-color .15s;
  }
  .check::after {
    content: ""; width: .45rem; height: .85rem;
    border: solid var(--on-purple); border-width: 0 3px 3px 0;
    transform: translateY(-2px) rotate(45deg) scale(0);
    transition: transform .2s cubic-bezier(.34, 1.56, .64, 1);
  }
  .check:checked { background: var(--purple); border-color: var(--purple); }
  .check:checked::after { transform: translateY(-2px) rotate(45deg) scale(1); }
  .check:disabled { cursor: default; }
  .check:disabled:not(:checked) { border-style: dashed; }
  .item-text { display: block; cursor: pointer; }
  .letter { font-family: var(--serif); font-style: italic; color: var(--muted); margin-right: .3rem; }
  .item.is-done .task { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--box); text-decoration-thickness: 1px; }
  .item-details { margin: .25rem 0 0; max-width: 60ch; font-size: .95rem; color: var(--muted); }
  .item-link { display: inline-block; margin-top: .3rem; font-size: .95rem; color: var(--purple); text-underline-offset: 3px; }
  .item-meta { margin: .3rem 0 0; font-size: .9rem; color: var(--muted); }
  .review { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.1rem; margin-top: .6rem; }
  .review-state { margin: 0; font-size: .9rem; color: var(--muted); }
  .review-state.waiting { color: var(--ink); font-weight: 700; }
  .answers { margin-top: .6rem; font-size: .95rem; }
  .answers summary { cursor: pointer; color: var(--purple); font-weight: 700; }
  .answers dl { margin: .5rem 0 0; padding: .6rem .9rem; border-left: 3px solid var(--box); }
  .answers dt { font-weight: 700; }
  .answers dt:not(:first-child) { margin-top: .5rem; }
  .answers dd { margin: .1rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-area { margin-top: .35rem; }
  .link-btn {
    font: inherit; font-size: .9rem;
    background: none; border: 0; padding: .15rem 0;
    color: var(--purple); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .add-note { color: var(--muted); }
  .note { margin-top: .35rem; padding: .6rem .8rem; background: var(--note); border-left: 3px solid var(--note-edge); border-radius: 0 .4rem .4rem 0; }
  .note-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .25rem 1rem; margin-top: .35rem; font-size: .9rem; color: var(--muted); }
  .note-input {
    width: 100%; min-height: 3.2rem; resize: vertical;
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--paper); border: 2px solid var(--box); border-radius: .5rem;
    padding: .55rem .7rem;
  }
  .note-input:focus-visible { outline-offset: 0; }
  .note-input[aria-invalid="true"] { border-color: var(--error); }
  .note-actions { display: flex; align-items: center; gap: 1.1rem; margin-top: .5rem; }
  .btn {
    font: inherit; font-size: .95rem; font-weight: 700;
    background: var(--purple); color: var(--on-purple);
    border: 0; border-radius: .5rem; padding: .5rem 1.05rem; cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-small { font-size: .9rem; padding: .38rem .9rem; }

  /* Pop-ups */
  .dialog {
    width: min(34rem, calc(100% - 2rem)); max-height: calc(100% - 2rem);
    padding: 1.6rem 1.5rem 1.4rem; border: 0; border-radius: .9rem;
    background: var(--paper); color: var(--ink);
  }
  .dialog::backdrop { background: rgba(23, 12, 33, .5); }
  .dialog-title { margin: 0; font-family: var(--serif); font-weight: 600; color: var(--purple); font-size: 1.5rem; line-height: 1.2; }
  .dialog-sub { margin: .35rem 0 1.25rem; color: var(--muted); }
  .field + .field { margin-top: 1.1rem; }
  .field-label { display: block; margin-bottom: .35rem; font-weight: 700; font-size: .98rem; }
  .confirm-row { display: grid; grid-template-columns: 1.6rem 1fr; gap: .7rem; align-items: start; font-weight: 700; cursor: pointer; }
  .confirm-row .check { margin-top: .05rem; }
  .field-error { margin: .35rem 0 0; color: var(--error); font-size: .9rem; font-weight: 700; }
  .pin-input { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--box); border-radius: .5rem; padding: .55rem .7rem; }
  .dialog-actions { display: flex; align-items: center; gap: 1.2rem; margin-top: 1.5rem; }

  .foot { margin-top: 3rem; font-size: .9rem; color: var(--muted); }
  .foot p { margin: 0; }
  .status { min-height: 1.5em; margin-bottom: .35rem !important; font-weight: 700; color: var(--ink); }
  .status.error { color: var(--error); }

  .petal-shower { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .petal-drop { position: absolute; top: -2rem; width: .75rem; height: .75rem; border-radius: 50% 0 50% 50%; background: var(--bloom); animation: fall var(--d) linear var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 108vh) rotate(var(--r)); opacity: .25; } }

  @media (max-width: 30rem) {
    .top { flex-direction: column-reverse; }
    .stamp { align-self: flex-end; margin: 0 0 -.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <p id="loading" class="subtitle">Loading your checklist…</p>

  <section id="message" hidden>
    <h1 id="message-title"></h1>
    <p id="message-body" class="subtitle"></p>
  </section>

  <div id="app" hidden>
    <div id="owner-bar" class="owner-bar" hidden>
      <span id="owner-label"></span>
      <button id="lock-btn" class="link-btn" type="button">Lock</button>
    </div>

    <header class="top">
      <div>
        <h1 id="name"></h1>
        <p id="subtitle" class="subtitle"></p>
        <p class="status-line"><span class="status-label">Status</span><span id="stage" class="status-stage"></span></p>
      </div>
      <div id="stamp" class="stamp" hidden aria-hidden="true">
        <span class="stamp-word">Enacted</span>
        <span id="stamp-date" class="stamp-date"></span>
      </div>
    </header>

    <section class="progress" aria-label="Progress">
      <div id="garden" class="garden" role="progressbar" aria-valuemin="0"></div>
      <p id="count" class="count"></p>
      <p id="done-banner" class="done-banner" hidden></p>
    </section>

    <div id="list" class="list"></div>

    <footer class="foot">
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p>Changes save automatically and show up for both of you. The page checks for new changes every 30 seconds.</p>
    </footer>
  </div>

  <noscript><p>This checklist needs JavaScript turned on.</p></noscript>
</main>

<dialog id="review-dialog" class="dialog" aria-labelledby="review-title">
  <form id="review-form" method="dialog" novalidate>
    <h2 id="review-title" class="dialog-title"></h2>
    <p id="review-task" class="dialog-sub"></p>
    <div id="review-fields"></div>
    <div class="dialog-actions">
      <button type="submit" class="btn" id="review-send">Send for review</button>
      <button type="button" class="link-btn" id="review-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="pin-dialog" class="dialog" aria-labelledby="pin-title">
  <form id="pin-form" method="dialog" novalidate>
    <h2 id="pin-title" class="dialog-title">Reviewer access</h2>
    <p class="dialog-sub">Enter your 4-digit PIN to approve tasks and send them back.</p>
    <label class="field-label" for="pin-input">PIN</label>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <p id="pin-error" class="field-error" hidden></p>
    <div class="dialog-actions">
      <button type="submit" class="btn" id="pin-go">Unlock</button>
      <button type="button" class="link-btn" id="pin-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script>
/* ---- Settings ------------------------------------------------------------ */
/* Paste your Power Automate flow URL (from the "When a HTTP request is received" trigger). */
const FLOW_URL = 'PASTE_YOUR_FLOW_URL_HERE';
const OWNER_NAME = 'Ryan';                            // Must match the OwnerName variable in the flow
const CHECKLIST_TITLE = 'Digital Advocacy Onboarding'; // Shown under each person's name
const NOTIFICATIONS_ON = true;                        // Change to true if you added the email step to the flow
/* --------------------------------------------------------------------------- */

(() => {
  'use strict';

  const POLL_MS = 30000;
  const PIN_KEY = 'checklist-reviewer-pin';
  const STAGES = ['Introduced', 'In committee', 'On the floor', 'Enacted'];
  const $ = (sel) => document.querySelector(sel);
  const id = (new URLSearchParams(location.search).get('id') || '').trim().toLowerCase();
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const FLOWER =
    '<svg viewBox="0 0 24 36" aria-hidden="true" focusable="false">' +
    '<path class="stem" d="M12 35V15"/>' +
    '<path class="leaf" d="M12 28c-4.5-.4-6.8-3.8-6.8-3.8 3.9-.9 6.3 1.3 6.8 3.8z"/>' +
    '<g class="petals"><circle cx="12" cy="6" r="4.2"/><circle cx="17.7" cy="10.2" r="4.2"/>' +
    '<circle cx="15.5" cy="16.9" r="4.2"/><circle cx="8.5" cy="16.9" r="4.2"/><circle cx="6.3" cy="10.2" r="4.2"/></g>' +
    '<circle class="center" cx="12" cy="12" r="3"/></svg>';

  let data = null;
  let reviewerPin = null;
  let pending = 0;
  let queue = Promise.resolve();
  let wasComplete = null;
  let statusTimer = null;
  let reviewNo = null;
  let lastFocus = null;
  let taps = [];
  let flowerEls = [];
  const editing = new Set();
  const itemEls = new Map();

  /* ---------- Small helpers ---------- */

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function getItem(no) { return data && data.items.find((i) => i.no === no); }
  function firstName(n) { return String(n).trim().split(/\s+/)[0] || String(n); }
  function fmt(iso, withYear) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
  }
  function byLine(prefix, person, iso) {
    const date = fmt(iso);
    return prefix + (person ? ' ' + person : '') + (date ? ' on ' + date : '');
  }
  function isReviewer() { return !!reviewerPin; }
  function currentWho() { return isReviewer() ? data.owner : data.name; }
  function readPin() { try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; } }
  function storePin(v) { try { localStorage.setItem(PIN_KEY, v); } catch (e) { /* private mode */ } }
  function clearPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) { /* private mode */ } }
  function showDialog(d) {
    lastFocus = document.activeElement;
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
  }
  function closeDialog(d) {
    if (typeof d.close === 'function') d.close(); else d.removeAttribute('open');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function actionBtn(cls, text, fn) {
    const b = el('button', cls, text);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }

  function showMessage(title, body) {
    $('#loading').hidden = true;
    $('#app').hidden = true;
    $('#message-title').textContent = title;
    $('#message-body').textContent = body;
    $('#message').hidden = false;
  }

  function setStatus(text, opts) {
    opts = opts || {};
    const s = $('#status');
    clearTimeout(statusTimer);
    s.textContent = text;
    s.classList.toggle('error', !!opts.error);
    if (opts.clearAfter) statusTimer = setTimeout(() => { s.textContent = ''; }, opts.clearAfter);
  }

  /* Review questions: one per line or separated by |. "(optional)" at the end makes one optional.
     "Confirm:" at the start makes a required checkbox. */
  function parseQuestions(raw) {
    return String(raw || '').split(/\r?\n|\|/).map((s) => s.trim()).filter(Boolean).map((line) => {
      const m = line.match(/^confirm:\s*(.+)$/i);
      if (m) return { type: 'confirm', q: m[1].trim(), required: true };
      return { type: 'text', q: line, required: !/\(optional\)\s*$/i.test(line), long: /^paste\b/i.test(line) };
    });
  }
  function parseSubmission(raw) {
    if (!raw) return [];
    try {
      const v = JSON.parse(raw);
      return Array.isArray(v) ? v.filter((x) => x && typeof x.q === 'string') : [];
    } catch (e) { return []; }
  }
  function summaryText(answers) {
    return answers.map((a) => (a.type === 'confirm' ? 'Confirmed: ' + a.q : a.q + '\n' + (a.a || 'No answer'))).join('\n\n');
  }

  /* ---------- Talking to the Power Automate flow ---------- */

  async function callFlow(payload) {
    // text/plain keeps the browser from sending a preflight request the flow can't answer.
    const res = await fetch(FLOW_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('http_' + res.status);
    return res.json();
  }

  function toChecklist(rows) {
    const items = rows.map((r) => ({
      no: Number(r.ID),
      order: Number(r.ItemNo) || 0,
      section: r.Section || '',
      text: r.Title || '',
      details: r.Details || '',
      link: r.TaskLink || '',
      needsApproval: r.NeedsApproval === true,
      questions: parseQuestions(r.ReviewQuestions),
      submission: parseSubmission(r.Submission),
      sentForReview: r.SentForReview === true,
      sentAt: r.SentAt || '',
      done: r.Done === true,
      checkedBy: r.CheckedBy || '',
      checkedAt: r.CheckedAt || '',
      note: r.Note || '',
      noteBy: r.NoteBy || '',
      noteAt: r.NoteAt || '',
    })).sort((a, b) => a.order - b.order || a.no - b.no);
    return {
      id: id,
      name: (rows[0] && rows[0].StaffName) || '',
      owner: OWNER_NAME,
      title: CHECKLIST_TITLE,
      notifies: NOTIFICATIONS_ON,
      items: items,
    };
  }

  async function apiLoad(pin) {
    const payload = { action: 'load', id: id };
    if (pin) { payload.who = OWNER_NAME; payload.pin = pin; }
    const r = await callFlow(payload);
    if (r && r.ok && Array.isArray(r.rows)) {
      if (!r.rows.length) return { ok: false, error: 'not_found' };
      return { ok: true, checklist: toChecklist(r.rows), reviewer: r.owner === true };
    }
    return r;
  }

  async function refresh(first) {
    if (!first && pending > 0) return;
    try {
      const r = await apiLoad(reviewerPin);
      if (!r || !r.ok) {
        if (first && r && r.error === 'not_found') {
          showMessage('This link doesn\u2019t match a checklist', 'Check that you copied the whole link. If it still doesn\u2019t work, ask the person who sent it for a new one.');
        } else if (first) {
          showMessage('The checklist didn\u2019t load', 'Reload the page in a minute. If it keeps happening, let the person who sent you this link know.');
        }
        return;
      }
      if (!first && pending > 0) return; // a save started meanwhile; the next refresh catches up
      const wasReviewer = isReviewer();
      if (reviewerPin && !r.reviewer) {
        reviewerPin = null;
        clearPin();
        if (!first) setStatus('Your PIN stopped working, so reviewer access is locked. Tap the flowers five times to unlock it again.', { error: true });
      }
      apply(r.checklist, { rebuild: first || wasReviewer !== isReviewer(), intro: first });
      if (!first && $('#status').classList.contains('error') && isReviewer() === wasReviewer) setStatus('');
    } catch (err) {
      if (first) showMessage('The checklist didn\u2019t load', 'Check your internet connection and reload the page.');
      else setStatus('Couldn\u2019t check for updates. Trying again in 30 seconds.', { error: true });
    }
  }

  function save(change, okText, rollback) {
    const payload = Object.assign({ action: 'save', id: id, who: currentWho() }, reviewerPin ? { pin: reviewerPin } : {}, change);
    pending++;
    setStatus('Saving\u2026');
    queue = queue.then(async () => {
      try {
        const r = await callFlow(payload);
        if (!r || !r.ok) throw new Error((r && r.error) || 'save_failed');
        if (pending === 1) setStatus(okText, { clearAfter: okText.length > 20 ? 7000 : 2500 });
      } catch (err) {
        rollback();
        setStatus('That change didn\u2019t save. Check your connection and try again.', { error: true });
      } finally {
        pending--;
      }
    });
  }

  /* ---------- Rendering ---------- */

  function apply(c, opts) {
    opts = opts || {};
    const sameShape = !!data && data.items.length === c.items.length &&
      data.items.every((it, i) => it.no === c.items[i].no && it.section === c.items[i].section);
    data = c;
    if (opts.rebuild || (!sameShape && editing.size === 0)) buildPage();
    else data.items.forEach(updateItem);
    updateProgress(!!opts.intro);
  }

  function sections() {
    const out = [];
    data.items.forEach((item) => {
      if (!out.length || out[out.length - 1].name !== item.section) out.push({ name: item.section, items: [] });
      out[out.length - 1].items.push(item);
    });
    return out;
  }

  function buildPage() {
    document.title = data.name + ': ' + data.title;
    $('#name').textContent = data.name;
    $('#subtitle').textContent = data.title + ' with ' + data.owner;
    $('#owner-bar').hidden = !isReviewer();
    $('#owner-label').textContent = 'You\u2019re reviewing as ' + firstName(data.owner) + '.';

    const garden = $('#garden');
    const list = $('#list');
    garden.replaceChildren();
    list.replaceChildren();
    itemEls.clear();
    flowerEls = [];
    let i = 0;
    sections().forEach((sec, s) => {
      const plot = el('div', 'plot');
      const plotFlowers = el('div', 'plot-flowers');
      plot.append(plotFlowers, el('span', 'plot-label', 'Sec. ' + (s + 1)));
      garden.append(plot);

      const group = el('section', 'group');
      group.append(el('p', 'group-kicker', 'Section ' + (s + 1)));
      if (sec.name) group.append(el('h2', 'group-title', sec.name));
      const ul = el('ul', 'items');
      group.append(ul);
      list.append(group);

      sec.items.forEach((item, n) => {
        const f = el('span', 'flower');
        f.style.setProperty('--i', i++);
        f.innerHTML = FLOWER;
        plotFlowers.append(f);
        flowerEls.push(f);
        ul.append(buildItem(item, '(' + String.fromCharCode(97 + (n % 26)) + ')'));
      });
    });

    $('#loading').hidden = true;
    $('#message').hidden = true;
    $('#app').hidden = false;
  }

  function buildItem(item, letter) {
    const li = el('li', 'item');
    const box = el('input', 'check');
    box.type = 'checkbox';
    box.id = 'item-' + item.no;
    box.addEventListener('change', () => onToggle(item.no, box));

    const body = el('div', 'item-body');
    const label = el('label', 'item-text');
    label.htmlFor = box.id;
    const task = el('span', 'task');
    label.append(el('span', 'letter', letter), task);
    const details = el('p', 'item-details');
    const link = el('a', 'item-link', 'Open link');
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    const meta = el('p', 'item-meta');
    const review = el('div', 'review');
    const answers = el('div', 'answers-wrap');
    const noteArea = el('div', 'note-area');
    body.append(label, details, link, meta, review, answers, noteArea);
    li.append(box, body);

    itemEls.set(item.no, { li, box, task, details, link, meta, review, answers, noteArea });
    updateItem(item);
    return li;
  }

  function updateItem(item) {
    const r = itemEls.get(item.no);
    if (!r) return;
    r.li.classList.toggle('is-done', item.done);
    r.box.checked = item.done;
    r.box.disabled = !!item.needsApproval;
    r.task.textContent = item.text;
    r.details.textContent = item.details || '';
    r.details.hidden = !item.details;
    if (item.link && /^https?:\/\//i.test(item.link)) {
      r.link.href = item.link;
      r.link.setAttribute('aria-label', 'Open link for ' + item.text + ' (opens in a new tab)');
      r.link.hidden = false;
    } else {
      r.link.removeAttribute('href');
      r.link.hidden = true;
    }
    r.meta.textContent = item.done
      ? byLine(item.needsApproval ? 'Approved' : 'Checked', item.checkedBy ? 'by ' + firstName(item.checkedBy) : '', item.checkedAt)
      : '';
    r.meta.hidden = !item.done;
    renderReview(item, r.review);
    renderAnswers(item, r.answers);
    if (!editing.has(item.no)) renderNote(item, r.noteArea);
  }

  // Tasks that need approval: the staffer sends them for review, and only the reviewer checks them off.
  function renderReview(item, area) {
    area.replaceChildren();
    area.hidden = !item.needsApproval;
    if (!item.needsApproval) return;
    const owner = firstName(data.owner);

    if (item.done) {
      if (isReviewer()) area.append(actionBtn('link-btn', 'Undo approval', () => setDone(item.no, false)));
      else area.hidden = true;
      return;
    }
    if (item.sentForReview) {
      const since = fmt(item.sentAt);
      area.append(el('p', 'review-state waiting', 'Waiting on ' + owner + '\u2019s review' + (since ? ' since ' + since : '')));
      if (isReviewer()) {
        area.append(actionBtn('btn btn-small', 'Approve', () => setDone(item.no, true)));
        area.append(actionBtn('link-btn', 'Send back', () => sendBack(item.no)));
      } else {
        area.append(actionBtn('link-btn', 'Take back', () => setReview(item.no, false)));
      }
      return;
    }
    if (isReviewer()) {
      area.append(el('p', 'review-state', 'Not sent for review yet'));
      area.append(actionBtn('link-btn', 'Approve anyway', () => setDone(item.no, true)));
    } else {
      area.append(actionBtn('btn btn-small', 'Send to ' + owner + ' for review', () => startReview(item.no)));
    }
  }

  function renderAnswers(item, box) {
    const prev = box.querySelector('details');
    const wasOpen = prev ? prev.open : null;
    box.replaceChildren();
    const subs = item.submission || [];
    box.hidden = !item.needsApproval || !subs.length;
    if (box.hidden) return;
    const d = el('details', 'answers');
    d.open = wasOpen != null ? wasOpen : (isReviewer() && item.sentForReview && !item.done);
    d.append(el('summary', null, isReviewer() ? 'Their answers' : 'Your answers'));
    const dl = el('dl');
    subs.forEach((s) => {
      if (s.type === 'confirm') dl.append(el('dt', null, 'Confirmed'), el('dd', null, s.q));
      else dl.append(el('dt', null, s.q), el('dd', null, s.a ? String(s.a) : 'No answer'));
    });
    d.append(dl);
    box.append(d);
  }

  function renderNote(item, area) {
    area.replaceChildren();
    if (item.note) {
      const card = el('div', 'note');
      const foot = el('div', 'note-foot');
      foot.append(el('span', 'note-by', item.noteBy ? byLine(firstName(item.noteBy), '', item.noteAt) : ''), actionBtn('link-btn', 'Edit note', () => openEditor(item.no)));
      card.append(el('p', 'note-text', item.note), foot);
      area.append(card);
    } else {
      area.append(actionBtn('link-btn add-note', 'Add note', () => openEditor(item.no)));
    }
  }

  function stageFor(done, total) {
    if (!total || done === 0) return STAGES[0];
    if (done === total) return STAGES[3];
    return done / total < 0.5 ? STAGES[1] : STAGES[2];
  }

  function updateProgress(intro) {
    const total = data.items.length;
    const done = data.items.filter((i) => i.done).length;
    const garden = $('#garden');
    if (flowerEls.length !== total) buildPage();

    garden.setAttribute('aria-valuemax', String(total));
    garden.setAttribute('aria-valuenow', String(done));
    garden.setAttribute('aria-valuetext', done + ' of ' + total + ' done');
    $('#count').textContent = total ? done + ' of ' + total + ' done' : 'No items yet';
    $('#stage').textContent = stageFor(done, total);

    const bloom = () => flowerEls.forEach((f, i) => f.classList.toggle('bloom', !!(data.items[i] && data.items[i].done)));
    if (intro && !reduceMotion) {
      garden.classList.add('intro');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bloom();
        setTimeout(() => garden.classList.remove('intro'), 55 * total + 600);
      }));
    } else {
      bloom();
    }

    const complete = total > 0 && done === total;
    const banner = $('#done-banner');
    banner.hidden = !complete;
    if (complete) banner.textContent = 'Everything\u2019s checked off. Nice work, ' + firstName(data.name) + ' and ' + firstName(data.owner) + '.';
    const stamp = $('#stamp');
    stamp.hidden = !complete;
    if (complete) {
      const last = data.items.map((i) => i.checkedAt).filter(Boolean).sort().pop();
      $('#stamp-date').textContent = fmt(last, true);
    }
    if (complete && wasComplete === false) celebrate();
    wasComplete = complete;
  }

  function celebrate() {
    if (reduceMotion) return;
    const garden = $('#garden');
    const stamp = $('#stamp');
    garden.classList.remove('celebrate');
    stamp.classList.remove('stamp-in');
    void garden.offsetWidth;
    garden.classList.add('celebrate');
    stamp.classList.add('stamp-in');
    setTimeout(() => garden.classList.remove('celebrate'), 3500);

    const shower = el('div', 'petal-shower');
    shower.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 28; i++) {
      const p = el('span', 'petal-drop');
      p.style.left = (Math.random() * 100).toFixed(1) + 'vw';
      p.style.setProperty('--d', (2.4 + Math.random() * 1.6).toFixed(2) + 's');
      p.style.setProperty('--delay', (Math.random() * 0.8).toFixed(2) + 's');
      p.style.setProperty('--x', Math.round(Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--r', Math.round(Math.random() * 540 - 270) + 'deg');
      if (i % 4 === 0) p.style.background = 'var(--center)';
      shower.append(p);
    }
    document.body.append(shower);
    setTimeout(() => shower.remove(), 5000);
  }

  /* ---------- Actions ---------- */

  function onToggle(no, box) { setDone(no, box.checked); }

  function setDone(no, value) {
    const item = getItem(no);
    if (!item) return;
    if (item.needsApproval && !isReviewer()) { updateItem(item); return; }
    const prev = { done: item.done, checkedBy: item.checkedBy, checkedAt: item.checkedAt };
    Object.assign(item, { done: value, checkedBy: value ? currentWho() : '', checkedAt: value ? new Date().toISOString() : '' });
    updateItem(item);
    updateProgress(false);
    const okText = item.needsApproval ? (value ? 'Approved' : 'Approval undone') : 'Saved';
    save({ no: no, field: 'done', value: value }, okText, () => {
      const cur = getItem(no);
      if (!cur) return;
      Object.assign(cur, prev);
      updateItem(cur);
      updateProgress(false);
    });
  }

  function setReview(no, value, answers, okText) {
    const item = getItem(no);
    if (!item || item.done) return;
    const prev = { sentForReview: item.sentForReview, sentAt: item.sentAt, submission: item.submission };
    Object.assign(item, { sentForReview: value, sentAt: value ? new Date().toISOString() : '' });
    if (value) item.submission = answers || [];
    updateItem(item);
    const owner = firstName(data.owner);
    const sentText = data.notifies
      ? 'Sent to ' + owner + ' for review. ' + (answers && answers.length ? 'He\u2019ll get your answers by email.' : 'He\u2019ll get a notification.')
      : 'Sent to ' + owner + ' for review. Be sure to ping him too.';
    const change = { no: no, field: 'review', value: value };
    if (value) { change.submission = answers || []; change.summary = summaryText(answers || []); }
    save(change, okText || (value ? sentText : 'Taken back'), () => {
      const cur = getItem(no);
      if (!cur) return;
      Object.assign(cur, prev);
      updateItem(cur);
    });
  }

  function sendBack(no) {
    setReview(no, false, null, 'Sent back. Leave a note about what to change.');
    openEditor(no);
  }

  function startReview(no) {
    const item = getItem(no);
    if (!item) return;
    if (!item.questions.length) { setReview(no, true, []); return; }
    reviewNo = no;
    $('#review-title').textContent = 'Send to ' + firstName(data.owner) + ' for review';
    $('#review-task').textContent = item.text;
    const wrap = $('#review-fields');
    wrap.replaceChildren();
    const prev = item.submission || [];
    item.questions.forEach((q, i) => {
      const fid = 'rq-' + i;
      const field = el('div', 'field');
      if (q.type === 'confirm') {
        const row = el('label', 'confirm-row');
        const cb = el('input', 'check');
        cb.type = 'checkbox';
        cb.id = fid;
        row.append(cb, el('span', null, q.q));
        field.append(row);
      } else {
        const lab = el('label', 'field-label', q.q);
        lab.htmlFor = fid;
        const ta = el('textarea', 'note-input');
        ta.id = fid;
        ta.rows = q.long ? 5 : 2;
        ta.maxLength = 2000;
        const old = prev.find((p) => p.type !== 'confirm' && p.q === q.q);
        if (old && old.a) ta.value = String(old.a);
        field.append(lab, ta);
      }
      const err = el('p', 'field-error');
      err.id = fid + '-err';
      err.hidden = true;
      field.append(err);
      wrap.append(field);
    });
    showDialog($('#review-dialog'));
    const firstInput = wrap.querySelector('textarea, input');
    if (firstInput) firstInput.focus();
  }

  function submitReview(e) {
    e.preventDefault();
    const item = getItem(reviewNo);
    const dlg = $('#review-dialog');
    if (!item) { closeDialog(dlg); return; }
    let firstBad = null;
    const answers = item.questions.map((q, i) => {
      const input = document.getElementById('rq-' + i);
      const err = document.getElementById('rq-' + i + '-err');
      let bad;
      let answer;
      if (q.type === 'confirm') {
        bad = !input.checked;
        answer = { type: 'confirm', q: q.q, a: input.checked };
      } else {
        const v = input.value.trim();
        bad = q.required && !v;
        answer = { type: 'text', q: q.q, a: v };
      }
      err.textContent = bad ? (q.type === 'confirm' ? 'Check this box before sending.' : 'Answer this before sending.') : '';
      err.hidden = !bad;
      input.setAttribute('aria-invalid', String(bad));
      if (bad) input.setAttribute('aria-describedby', err.id); else input.removeAttribute('aria-describedby');
      if (bad && !firstBad) firstBad = input;
      return answer;
    });
    if (firstBad) { firstBad.focus(); return; }
    closeDialog(dlg);
    setReview(item.no, true, answers);
  }

  function openEditor(no, draft) {
    const item = getItem(no);
    const r = itemEls.get(no);
    if (!item || !r) return;
    editing.add(no);

    const area = r.noteArea;
    area.replaceChildren();
    const ta = el('textarea', 'note-input');
    ta.value = draft != null ? draft : item.note;
    ta.maxLength = 2000;
    ta.rows = 3;
    ta.setAttribute('aria-label', 'Note for ' + item.text);
    const actions = el('div', 'note-actions');
    const saveBtn = el('button', 'btn', 'Save note');
    saveBtn.type = 'button';
    const cancelBtn = el('button', 'link-btn', 'Cancel');
    cancelBtn.type = 'button';
    actions.append(saveBtn, cancelBtn);
    area.append(ta, actions);
    ta.focus();

    const close = () => {
      editing.delete(no);
      const cur = getItem(no);
      if (cur) renderNote(cur, area);
      const btn = area.querySelector('button');
      if (btn) btn.focus();
    };
    cancelBtn.addEventListener('click', close);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveBtn.click(); }
    });
    saveBtn.addEventListener('click', () => {
      const cur = getItem(no);
      if (!cur) return;
      const value = ta.value.trim();
      if (value === cur.note) { close(); return; }
      const prev = { note: cur.note, noteBy: cur.noteBy, noteAt: cur.noteAt };
      Object.assign(cur, { note: value, noteBy: value ? currentWho() : '', noteAt: value ? new Date().toISOString() : '' });
      close();
      save({ no: no, field: 'note', value: value }, value ? 'Note saved' : 'Note removed', () => {
        const c2 = getItem(no);
        if (c2) Object.assign(c2, prev);
        openEditor(no, value); // reopen with the unsaved text so nothing is lost
      });
    });
  }

  /* ---------- Reviewer access: tap the flowers five times, then enter the PIN ---------- */

  function onGardenTap() {
    const now = Date.now();
    taps = taps.filter((t) => now - t < 3000);
    taps.push(now);
    if (taps.length < 5) return;
    taps = [];
    if (isReviewer()) return;
    $('#pin-input').value = '';
    $('#pin-error').hidden = true;
    showDialog($('#pin-dialog'));
    $('#pin-input').focus();
  }

  async function submitPin(e) {
    e.preventDefault();
    const pin = $('#pin-input').value.trim();
    const err = $('#pin-error');
    const go = $('#pin-go');
    const fail = (text) => { err.textContent = text; err.hidden = false; $('#pin-input').focus(); };
    if (!pin) { fail('Enter your PIN.'); return; }
    go.disabled = true;
    go.textContent = 'Checking\u2026';
    try {
      const r = await apiLoad(pin);
      if (r && r.ok && r.reviewer) {
        reviewerPin = pin;
        storePin(pin);
        closeDialog($('#pin-dialog'));
        apply(r.checklist, { rebuild: true });
        setStatus('Unlocked. You\u2019re reviewing as ' + firstName(OWNER_NAME) + '.', { clearAfter: 5000 });
      } else {
        fail('That PIN didn\u2019t work.');
      }
    } catch (x) {
      fail('Couldn\u2019t check your PIN. Check your connection and try again.');
    } finally {
      go.disabled = false;
      go.textContent = 'Unlock';
    }
  }

  function lock() {
    reviewerPin = null;
    clearPin();
    apply(data, { rebuild: true });
    setStatus('Locked. You\u2019re back to the staff view.', { clearAfter: 5000 });
  }

  /* ---------- Start ---------- */

  $('#garden').addEventListener('click', onGardenTap);
  $('#lock-btn').addEventListener('click', lock);
  $('#review-form').addEventListener('submit', submitReview);
  $('#review-cancel').addEventListener('click', () => closeDialog($('#review-dialog')));
  $('#review-fields').addEventListener('input', (e) => {
    const err = document.getElementById(e.target.id + '-err');
    if (err) { err.hidden = true; e.target.setAttribute('aria-invalid', 'false'); }
  });
  $('#pin-form').addEventListener('submit', submitPin);
  $('#pin-cancel').addEventListener('click', () => closeDialog($('#pin-dialog')));

  if (!id) {
    showMessage('Open your personal link', 'This page shows one person\u2019s checklist. Use the link you were sent. It ends with ?id= and a short code.');
  } else if (FLOW_URL.indexOf('PASTE_') === 0) {
    showMessage('One more setup step', 'Add your Power Automate flow URL to FLOW_URL in index.html, then reload this page.');
  } else {
    reviewerPin = readPin();
    refresh(true);
    setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); });
  }
})();
</script>
</body>
</html>
